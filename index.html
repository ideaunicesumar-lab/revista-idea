<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09285c"><title>Revista IDEA | Vol. 1, nº 1 — 2026</title><link rel="stylesheet" href="css/style.css"></head><body><div class="progress" id="progress"></div><header class="top"><div class="top-inner"><a class="brand" href="#inicio"><img src="assets/logo-idea-original.png" alt="Marca IDEA extraída da capa"> REVISTA IDEA</a><nav class="nav" aria-label="Navegação principal"><button data-nav="inicio">Início</button><button data-nav="materias">Matérias</button><button data-nav="sobre">Sobre a revista</button></nav></div></header><main id="app"></main><footer class="footer"><div class="footer-inner"><div><strong>REVISTA IDEA</strong><div>Perspectivas do Conhecimento em Gestão e Contabilidade</div></div><div>Vol. 1, nº 1 — 2026<br>Universidade UniCesumar · Campus Maringá</div></div></footer><script id="data" type="application/json">{"articles": [{"id": "materia-1", "title": "Corinthians em crise: o que a governança do clube revela sobre sua gestão?", "author": "Pedro Augusto Rudek Rodrigues", "category": "Esporte e gestão", "pages": [6, 7], "body": ["O Sport Club Corinthians Paulista atravessa, em 2026, um dos momentos financeiros mais críticos de sua história, com uma dívida de cerca de R$2,7 bilhões (Oliveira, 2026). O clube chegou ao topo da lista dos mais endividados do país, resultado de fragilidades na administração e nos mecanismos de governança. Um dos exemplos é o caso envolvendo a VaideBet (empresa brasileira do setor de apostas esportivas on-line), que gerou questionamentos sobre os processos de gestão e controle do clube.", "Esse cenário crítico é marcado pela falta de um planejamento financeiro eficiente, com uma dívida acumulada considerada insustentável e de difícil recuperação por especialistas. Esse cenário foi agravado pelo desempenho financeiro negativo, com déficit recorrente e aumento de aproximadamente R$600 milhões na dívida em um único ano de gestão (CNN BRASIL, 2025).", "O problema não surgiu de um dia para o outro, mas é consequência de decisões administrativas acumuladas ao longo de diferentes gestões. Além disso, a administração enfrentou problemas relacionados ao caso VaideBet, que contribuíram para o processo de impeachment do presidente Augusto Melo (CNN BRASIL, 2025) e aumentaram a pressão de torcedores e torcidas organizadas por mudanças na gestão e no estatuto do clube (EXAME, 2025). Esses acontecimentos demonstram como a falta de transparência e de mecanismos de controle podem gerar consequências administrativas, financeiras e sociais negativas.", "Para mudar esse cenário, entretanto, é necessário priorizar metas de receitas, despesas e investimentos. O planejamento financeiro é essencial para melhorar a situação econômica do clube, e a possibilidade de adoção de uma SAF vem sendo avaliada como uma alternativa estratégica para enfrentar as dívidas (Lemos, 2026). O Esporte Clube Bahia, por exemplo, conseguiu reduzir significativamente suas dívidas após a venda de 90% de sua SAF ao City Football Group.", "A SAF pode ser uma alternativa para clubes que enfrentam problemas financeiros, desde que seja acompanhada de planejamento, transparência e uma gestão profissional. Diante do exposto, fica claro que a crise do Corinthians não pode ser reduzida à gestão isolada de um presidente específico. Tratase de um problema estrutural, relacionado ao planejamento financeiro, à governança e à transparência. O aumento expressivo da dívida em um curto período demonstra a necessidade de mudanças profundas na forma como o clube é administrado.", "Mais do que apenas trocar dirigentes, é necessário discutir modelos de gestão que permitam maior controle financeiro, prestação de contas e responsabilidade administrativa. A experiência de outros clubes brasileiros mostra que alternativas como a SAF podem contribuir para a recuperação financeira quando são acompanhadas de metas claras e uma gestão profissional. Como estudante de Administração, entendo que esse caso representa uma importante lição sobre a necessidade de planejamento financeiro, organização e transparência, não apenas no esporte, mas em qualquer organização."], "references": ["CNN BRASIL. Augusto Melo sofre impeachment e deixa presidência do Corinthians. CNN Brasil, 09 ago. 2025.", "EXAME. Augusto Melo é destituído da presidência do Corinthians. Exame, 09 ago. 2025.", "LEMOS, Thiago. O Corinthians avalia modelo de SAF próprio como solução para crise e dívida de 2,7 bilhões. Mix Vale, 01 abr. 2026.", "OLIVEIRA, Gabriel. O Corinthians fecha 2025 com déficit de R$143,4 milhões e dívida bruta de R$ 2,7 bilhões. ge, 22 abr. 2026."]}, {"id": "materia-2", "title": "Quando jogar é estratégia: os benefícios dos jogos para desenvolver habilidades", "author": "Pedro André Mariano Costa", "category": "Tecnologia e comportamento", "pages": [8, 9], "body": ["Durante muito tempo, os jogos foram vistos apenas como uma forma de diversão. Muitas pessoas acreditavam que passar algumas horas jogando era perda de tempo, mas, com o avanço da tecnologia e das pesquisas, essa visão começou a mudar. Hoje podemos perceber que os jogos podem oferecer muito mais do que entretenimento. Quando utilizados de maneira equilibrada, eles podem contribuir para o desenvolvimento de diferentes habilidades.", "Um dos principais benefícios dos jogos está relacionado ao raciocínio. Em muitos jogos, o jogador precisa pensar antes de tomar uma decisão. É necessário observar o ambiente, criar estratégias e encontrar soluções para os problemas. Isso faz com que o jogador exercite sua capacidade de pensar rapidamente. Alguns jogos também trabalham com memória e atenção. O jogador precisa lembrar de informações, reconhecer padrões e prestar atenção aos detalhes. Uma pesquisa científica, publicada em 2026 na revista Acta Psychologica, analisou 133 estudos sobre videogames e habilidades cognitivas.", "Os pesquisadores encontraram uma associação entre jogar videogames e habilidades como memória, atenção visual e capacidade espacial (Zhao et al., 2026). Isso mostra que os jogos podem estimular algumas capacidades importantes do cérebro.", "Outro ponto interessante é que os jogos podem ensinar as pessoas a lidar com erros. Em um jogo, perder uma partida não significa que tudo acabou. O jogador pode descobrir onde errou e procurar uma maneira diferente de vencer. Dessa forma, os jogos podem ajudar a desenvolver persistência e capacidade de aprender com os próprios erros. Além disso, existem jogos que estimulam a criatividade. Jogos de construção, por exemplo, permitem que o jogador crie casas, cidades, mundos e diferentes tipos de estruturas. Nesse processo, é necessário imaginar possibilidades e transformar uma ideia em algo concreto.", "Os jogos também podem ajudar na interação entre as pessoas. Existem muitos jogos que dependem da cooperação entre jogadores. Neles, é preciso conversar, dividir tarefas e trabalhar em equipe para alcançar um objetivo. Assim, uma atividade que, muitas vezes, parece individual pode se transformar em uma experiência social. Outro benefício está relacionado à aprendizagem. Existem jogos desenvolvidos especialmente para ensinar conteúdos de maneira mais divertida e interativa. Em vez de apenas memorizar informações, o estudante pode aprender enquanto participa de desafios (Zhao et al., 2026).", "Pesquisas sobre jogos digitais educacionais também indicam resultados positivos no aprendizado em determinadas situações. Isso demonstra que a tecnologia pode ser utilizada como uma ferramenta para a educação. Entretanto, reconhecer os benefícios dos jogos não significa dizer que jogar o tempo todo seja saudável. Assim, como em qualquer outra atividade, é importante ter equilíbrio. Passar tempo demais jogando pode prejudicar o sono, os estudos, os relacionamentos e outras atividades importantes.", "Por isso, o problema não está necessariamente no jogo, mas na maneira como ele é utilizado. Talvez seja por isso que os jogos tenham conquistado tantas pessoas ao redor do mundo. Eles conseguem transformar desafios em diversão e, ao mesmo tempo, estimular diferentes habilidades. No final, talvez a pergunta não deva ser: “jogar é bom ou ruim?”. A pergunta mais importante deveria ser: “como podemos utilizar os jogos da melhor maneira possível?”"], "references": ["ZHAO, R; PANG, K.; YU, J.; ZHANG, W.; KONG, X.; WANG, J.; HAIDABIEKE, A.; DING, X.; LI, J. The association between video game play and cognitive ability: a systematic review and meta-analysis. Acta Psychologica, v. 267, 107110, 2026. DOI: 10.1016/j.actpsy.2026.107110"]}, {"id": "materia-3", "title": "Sem experiência, sem oportunidade? O paradoxo da entrada no mercado de trabalho", "author": "Thais da Rocha de Lara", "category": "Carreira", "pages": [10, 11], "body": ["Entrar no mercado de trabalho pode ser um grande desafio, principalmente para os jovens que estão buscando a primeira oportunidade. É comum encontrar vagas que exigem experiência profissional, formação acadêmica e diversos outros requisitos, mesmo quando as atividades da função não parecem exigir conhecimentos que não possam ser desenvolvidos por meio de treinamento. Essa situação cria uma contradição: se cada empresa possui seus próprios processos, sistemas, regras e cultura organizacional, por que a experiência profissional continua sendo uma exigência tão importante nas contratações?", "A experiência profissional, sem dúvida, tem seu valor. Uma pessoa que já trabalhou pode apresentar conhecimentos sobre rotinas, responsabilidades e comportamentos do ambiente profissional. Isso não significa, contudo, que ela esteja completamente preparada para qualquer organização.", "Cada empresa possui uma maneira própria de trabalhar, fazendo com que mesmo profissionais experientes precisem aprender e se adaptar. Por isso, a experiência pode ser um fator importante, mas não deveria ser tratada como um requisito absoluto.", "Minha própria trajetória como jovem aprendiz me fez perceber que experiência profissional não significa aprender uma única maneira de trabalhar. Já passei por três ambientes profissionais diferentes e, em cada um deles, encontrei uma dinâmica, uma rotina e uma forma de realizar as atividades. Cada experiência contribuiu para a profissional que sou hoje, mas também me mostrou que aquilo que aprendi em um lugar não necessariamente pode ser aplicado da mesma maneira em outro.", "Essa percepção também aparece em pesquisas sobre recrutamento e seleção. Antunes e DeMarco (2017), ao analisarem os critérios", "utilizados por organizações para contratar profissionais sem experiência, identificaram que uma das principais vantagens apontadas pelas empresas era justamente a ausência de vícios de outros trabalhos. Por outro lado, uma das principais desvantagens mencionadas era o tempo necessário para ensinar e treinar esse profissional. Dessa forma, a falta de experiência não deveria ser automaticamente interpretada como falta de capacidade. Além disso, existe um problema evidente para quem está tentando ingressar no mercado: como adquirir experiência se a primeira oportunidade já exige que ela exista?", "Um estudo de Cembranel et al. (2024) identificou justamente a percepção de jovens que acreditam não ter sido contratados devido à falta de experiência. Ao mesmo tempo, o estudo também mostrou que as empresas possuem suas próprias expectativas em relação à contratação de jovens. Esse cenário pode formar um ciclo difícil de romper: o jovem não consegue a oportunidade por não possuir experiência e, sem a oportunidade, continua sem conseguir desenvolver aquilo que o mercado exige. O problema surge quando a experiência passa de um critério de avaliação para uma barreira que impede completamente a entrada de pessoas que ainda não tiveram a oportunidade de desenvolver sua trajetória.", "Esse problema também é discutido internacionalmente. O estudo de O’Brien, Moran e Betts (2020), intitulado The Experience Gap in Hiring New Graduates, discute justamente a dificuldade enfrentada por recém-formados que procuram vagas de entrada, mas acabam sendo impedidos de participar de processos seletivos por não atenderem aos requisitos de experiência. Exigir anos de experiência para determinadas funções pode fazer com que a empresa descarte pessoas que possuem responsabilidade, dedicação, capacidade de aprender e vontade de crescer.", "Tenho como exemplo uma situação que vivenciei no ambiente profissional. Surgiu uma oportunidade na área financeira pela qual eu tinha interesse. Entretanto, a vaga acabou sendo ocupada por uma profissional que possuía mais experiência. Mesmo tendo experiência anterior, ela precisou aprender os sistemas e os procedimentos utilizados pela empresa praticamente do início, pois eram diferentes daqueles aos quais estava acostumada. Isso me fez questionar se a experiência anterior deveria ter sido um fator tão determinante para a contratação.", "As consequências dessa exigência excessiva atingem principalmente os jovens, que acabam perdendo oportunidades justamente por ainda não terem tido a oportunidade de construir experiência. No campo da Administração, essa questão mostra a importância de processos de recrutamento e seleção que enxerguem o candidato além do currículo.", "Dessa forma, considero que a experiência profissional é um fator importante na contratação, mas não deveria ser tratada como requisito absoluto, principalmente para funções de entrada, pois a capacidade de aprender, adaptar-se e desenvolver novas competências também pode representar valor para a organização. Talvez o mercado de trabalho precise deixar de perguntar apenas “onde essa pessoa já trabalhou?” e começar a perguntar também “o que essa pessoa é capaz de aprender e construir aqui?”. Afinal, se nenhuma empresa funciona exatamente da mesma maneira, talvez não seja justo exigir que alguém chegue pronto, quando parte importante do conhecimento necessário só poderá ser adquirida dentro da própria organização."], "references": ["ANTUNES, R. S.; DEMARCO, T. T. Contratação de profissionais sem experiência: critérios utilizados pelos recrutadores e selecionadores. Anuário Pesquisa e Extensão Unoesc Videira, v. 2, e14176, 2017.", "CEMBRANEL, P.; SANTOS, C. C. dos; LIMBERGER, C.; MACEDO, A. C. Perspectivas de inserção de jovens no mercado de trabalho. Revista de Carreiras e Pessoas, v. 14, n. 2, p. 291-308, 2024. DOI: 10.23925/recape.v14i2.56196.", "O'BRIEN, B.; MORAN, P.; BETTS, S. C. The experience gap in hiring new graduates: expecting too much for entry level positions. Journal of Academy of Business and Economics, v. 20, n. 3, p. 173-184, 2020. DOI: 10.18374/JABE-20-3.13.", "WESTBY, Samuel; MODESTINO, Alicia Sasser; CHENG, Peiran. Generative AI and the redefinition of entry-level software work. IZA Discussion Paper, n. 18723, June 2026. Bonn: IZA Institute of Labor Economics, 2026."]}, {"id": "materia-4", "title": "Diploma na mão, e agora? Os desafios do recém-formado em Ciências Contábeis", "author": "Pedro Henrique da Cruz", "category": "Carreira e contabilidade", "pages": [12, 13], "body": ["Vivemos em uma era de transformação na contabilidade, gerando grandes alterações tanto para as empresas quanto para as pessoas. Nesse contexto, podemos dizer que a contabilidade moderna vai além da formação inicial, conforme Nogueira e Fari (2007), o profissional contábil, deve, além de desenvolver as soft skills, buscar continuamente as hard skills, para garantir o seu espaço nesse mercado competitivo. É importante ressaltar a relevância das instituições de ensino superior, que devem estar alinhadas às demandas do mercado atual. Uma pesquisa realizada por Ribeiro et al. (2025), em que foram", "entrevistados 65 egressos do curso de Ciências Contábeis do UniFOA, investigou os desafios e as melhorias que a graduação necessita para se alinhar ao mercado de trabalho, os participantes apontaram diversos obstáculos para área, como: oportunidades diversificadas de estágios; execução de atividades práticas do dia a dia; conhecimento de sistemas contábeis; mudanças na legislação; provas do CRC; melhores oportunidades de vagas e cargos; desenvolvimento de competências interpessoais; e desenvolvimento de uma comunicação assertiva e ativa.", "a falta de experiência prática aparece como um dos principais desafios para recém-formados, indicando a importância de estágios e capacitação complementar. Desse modo, o recém-formado deve lidar com a alta competitividade e remunerações iniciais geralmente mais baixas. O profissional também precisa constantemente acompanhar as mudanças tecnológicas e profissionais da contabilidade, considerando as inovações nas áreas de auditoria e consultoria, e cargos estratégicos demandam atualizações permanentes e domínio de ferramentas tecnológicas.", "Entretanto, isso não significa que o cenário profissional seja necessariamente negativo para quem está concluindo a graduação. Uma pesquisa realizada por Oliveira e Vida (2023), que entrevistou 45 alunos do oitavo período de Ciências Contábeis do UNIPAM, demonstrou que a maioria teve uma visão mais positivista sobre o mercado de trabalho. Os participantes consideraram que existem boas oportunidades para os recém-formados, porém reconhecem a importância de participar de cursos, especialização e a necessidade de sempre se manter atualizado.", "Com a constante evolução da profissão, o contador moderno precisa aprimorar suas habilidades para além de seu campo, e as instituições de ensino superior desempenham um papel fundamental na formação desses futuros profissionais.", "Algumas possíveis práticas para auxiliar na formação acadêmica são: comparecer a palestras e eventos; participar de rodas de conversa com empresários e outros contadores; ter contato com softwares e ferramentas utilizados pelas empresas durante a formação acadêmica; e ampliar as oportunidades de estágio."], "references": ["NOGUEIRA, V.; FARI, M. A. Perfil do profissional contábil: relações entre formação e atuação no mercado de trabalho. Perspectivas Contemporâneas, v. 2, n. 1, 2007. RIBEIRO, B., C., R.; DELFINO, L. M. T.; CORRÊA, R. R. R.; PAULA, S.; FERREIRA, S., L.; REIS, P., N., C.; WASHINGTON, W.; LEÃO, A., F., A. Empregabilidade no mercado de trabalho para os bacharéis em Ciências Contábeis formados pelo UniFOA: dificuldades e possibilidades. Tudo é Ciência: Congresso Brasileiro de Ciências e Saberes Multidisciplinares, [S. l.], n. 3, p. 1-8, 2025. DOI: 10.47385/tudoeciencia.1840.2024.Tudo é Ciência: Congresso Brasileiro de Ciências e Saberes Multidisciplinares, n. 3, p. 1-8, 2025. DOI: 10.47385/tudoeciencia.1840.2024. OLIVEIRA, Natalia Nogueira de; VIDA, Laércio José. Perspectiva em relação ao mercado de trabalho do aluno egresso de Ciências Contábeis do UNIPAM. Anais do COMINE, v. 3, 2023. Publicado em 16 out. 2024."]}, {"id": "materia-5", "title": "De leads a pessoas: o desafio da liderança com automação", "author": "Karolaine Lucio", "category": "Liderança e inovação", "pages": [14, 15], "body": ["Este texto apresenta um relato de experiência com o objetivo de refletir sobre os desafios da liderança diante da automação em uma clínica odontológica. O relato de experiência consiste na descrição de uma vivência profissional acompanhada de reflexão crítica e fundamentação bibliográfica (Mussi; Flores; Almeida, 2021). O texto reúne situações da rotina de trabalho, especialmente da atuação como líder de setor, e as relaciona com publicações sobre inteligência artificial e gestão.", "Trabalho há três anos em uma clínica odontológica, sendo um ano como líder de setor, e “todo santo dia” vejo a tecnologia entrando pela porta. Os leads (contatos de pessoas interessadas nos serviços) caem automaticamente no nosso sistema e nós precisamos ligar ou mandar uma mensagem no WhatsApp para agendar avaliações. Isso é ótimo para agilizar, mas a verdade é que o “grosso” do trabalho está na conversa que vem depois. Eu, como líder e responsável pelo setor, ajusto várias estratégias de comunicação constantemente, porque cada paciente é um mundo. Tem gente que desiste na primeira objeção, tem gente que chora ao telefone contando uma história triste, e é aí que a máquina não resolve. Por mais que a gente use o ChatGPT para dar uma “força” em scripts ou para encontrar palavras melhores diante de uma situação delicada, a decisão final de como abordar aquele paciente é sempre nossa. E isso me fez acreditar firmemente que gestão não se terceiriza para algoritmo.", "A rotina mostra que os números são importantes, mas não são tudo. Nós temos métricas de agendamentos e taxas de conversão, mas nunca tomamos uma decisão somente com base nesses números.", "Se alguma das quatro colaboradoras que lidero está com resultados abaixo do esperado, procuro conversar e entender se ela está bem, se está tendo algum problema pessoal. O feedback é uma via de mão dupla: eu ensino, mas também aprendo bastante com elas. Segundo dados divulgados pela PwC Brasil (2025), o número de anúncios de vagas que exigiam conhecimentos em inteligência artificial no país passou de 19 mil, em 2021, para 73 mil, em 2024, quase quadruplicando.", "Mas o que eu vejo na prática é que o papel do líder está mudando e não sumindo. A máquina pode gerar um lead, mas quem transforma esse lead em um paciente fidelizado somos eu e minha equipe, com jogo de cintura e empatia.", "Claro que eu tenho receios. Já ouvi falar de outras clínicas que testaram a IA para conversar com pacientes e o negócio “bugou feio” (por exemplo, com respostas erradas e falta de empatia em situações sensíveis). Isso me preocupa, porque lidamos diretamente com a dor dos pacientes e enfrentamos muitas situações delicadas. Se a IA errar, o paciente pode se sentir ofendido e nunca mais voltar. Uma matéria escrita por Valéria França (2026) e publicada pela revista Veja apresenta um levantamento da Newnew com mais de 300 lideranças de médias e grandes organizações brasileiras. Segundo a reportagem, 80% das empresas representadas no levantamento utilizam IA, mas apenas 11% das lideranças avaliam que a implementação “deu super certo”. O levantamento aponta que os principais gargalos são humanos e estratégicos. Cerca de 70% dos gargalos identificados estão relacionados à cultura organizacional, à falta de habilidades críticas e às dificuldades de direcionamento da liderança.", "Na minha rotina, a automação está presente na organização dos contatos e no apoio ao atendimento. Essa experiência me mostra que o uso da IA exige atualização e avaliação das ferramentas pelo gestor. O gestor que se limita a apertar botões pode deixar de desenvolver competências importantes para a liderança. A minha experiência diária reforça essa percepção. Quando acompanho uma abordagem realizada pelas colaboradoras e percebo o resultado na satisfação do paciente, reconheço a contribuição da tecnologia e da liderança da equipe.", "Na clínica em que trabalho, a automação tem sido um apoio à gestão e um convite para evoluirmos. A tecnologia entrou para ajudar, mas quem dá o tom da conversa, quem resolve um imprevisto, quem segura a mão de uma paciente assustada, somos eu e minhas colaboradoras. Nessa experiência, o uso da tecnologia continua acompanhado da nossa responsabilidade pelo atendimento."], "references": ["FRANÇA, Valéria. Inteligência artificial: só 10% das empresas dizem que a implementação deu certo. Veja, 09 mar. 2026. Disponível em: https://veja.abril.com.br/tecnologia/inteligenciaartificial-so-10-das-empresas-dizem-que-a-implementacao-deucerto/. Acesso em: 09 out. 2026.", "MUSSI, Ricardo Franklin de Freitas; FLORES, Fábio Fernandes; ALMEIDA, Claudio Bispo de. Pressupostos para a elaboração de relato de experiência como conhecimento científico. Práxis Educacional, Vitória da Conquista, v. 17, n. 48, p. 60-77, 2021. DOI: 10.22481/praxisedu.v17i48.9010 .", "PWC BRASIL. Número vagas de emprego que exigem conhecimentos em IA quadruplicou no Brasil de 2021 a 2024, diz PwC. São Paulo, 15 jul. 2025. PwC Brasil. Disponível em: https://www.pwc.com.br/pt/sala-deimprensa/release/2025/numero-vagas-de-emprego-que-exigemconhecimentos-em-ia-quadruplicou-no-brasil-de-2021-a-2024diz-pwc.html. Acesso em: 09 out. 2026."]}, {"id": "materia-6", "title": "Qualidade de vida e saúde mental: como as empresas estão lidando com esses temas", "author": "Cleisson dos Santos Medeiro", "category": "Gestão de pessoas", "pages": [16, 17], "body": ["Por muito tempo, boa parte das empresas ignorava esses assuntos dentro delas por não entender que era de sua responsabilidade tratar deles, por pensar que isso era de responsabilidade exclusiva do colaborador ou então realizava ações pontuais, mas sem dar a devida importância ou se aprofundar no tema. Mas, após a pandemia de COVID19, os números de afastamentos relacionados à saúde mental aumentaram no Brasil. Em 2025, foram registrados 546.254 benefícios por incapacidade temporária relacionados a transtornos mentais e comportamentais, um crescimento de 15,66% em relação a 2024 e o maior número registrado nos últimos anos (Perfil Saúde Corporativa, 2026).", "Os afastamentos podem pesar no orçamento das empresas por causa da baixa produtividade dos colaboradores, do aumento no absenteísmo e até das dificuldades em trazer novos talentos para a empresa, fazendo com que elas tenham que aumentar seus custos com funcionários para manter o nível de produtividade desejado. Segundo uma pesquisa divulgada pelo Wellhub (2026), 89% dos líderes de RH brasileiros entrevistados afirmaram que questões relacionadas à saúde mental já aumentavam os custos das empresas. Com isso, algumas empresas passaram a se preocupar mais com a qualidade de vida de seus funcionários e com a qualidade do ambiente de trabalho em que eles estavam inseridos.", "Algumas empresas passaram a dar suporte psicológico aos trabalhadores, contratando psicólogos para acompanharem suas rotinas e para ouvirem seus problemas relacionados tanto ao trabalho quanto à vida pessoal. Muitas também passaram a fornecer benefícios para seus funcionários praticarem atividades físicas, como o Wellhub, antigo Gympass, ou então realizando atividades em suas empresas, como yoga. Essas empresas notaram uma melhora significativa na produtividade deles.", "Outra alternativa que se intensificou por conta da pandemia foram os modelos de trabalho híbrido e remoto, que fizeram com que o tempo de deslocamento semanal até o trabalho diminuísse, sendo essa uma das principais reclamações entre os trabalhadores.", "O início desses modelos, contudo, não foi fácil, pois muitas empresas foram obrigadas a fazer essa mudança sem se preparar para ela, trazendo mais problemas do que benefícios, já que não tinham tecnologia nem capacitação de seus líderes para atuarem nesses modelos. Isso trouxe problemas como sobrecarga de trabalho, mensagens fora do horário de trabalho e até problemas na comunicação sobre os objetivos da empresa e no feedback sobre o trabalho dos funcionários, fazendo com que as pessoas da equipe se distanciassem umas das outras.", "Com o passar do tempo, esses modelos de trabalho acabaram evoluindo e preenchendo lacunas que aconteciam, como: na comunicação, na definição de horários de trabalho e até na criação de uma cultura de feedback para seus colaboradores, fazendo com que as pessoas se sentissem pertencentes à equipe. Esses modelos de trabalho foram tão bem aceitos pelos trabalhadores que, segundo levantamento da consultoria Michael Page divulgado em 2025, seis a cada dez profissionais brasileiros afirmaram que deixariam o emprego caso fossem obrigados a aumentar o número de dias presenciais na empresa. A flexibilidade do trabalho também pode contribuir para o equilíbrio entre vida pessoal e profissional, permitindo passar mais tempo com a família, praticar atividades físicas e até buscar qualificação profissional.", "Em 2021, a empresa implementou o “Work From Anywhere” (trabalhe de qualquer lugar), permitindo que seus funcionários escolhessem trabalhar principalmente de casa ou do escritório, além de oferecer maior flexibilidade sobre o local de trabalho (Spotify, 2021). Uma pesquisa interna feita em 2019, antes da pandemia, já apontava que seus funcionários valorizavam a flexibilidade do trabalho e que, com isso, a empresa poderia manter bons funcionários e atrair novos talentos (Mohan, 2024).", "Manter uma cultura empresarial com sua equipe espalhada se torna mais difícil; entretanto, a empresa criou eventos para reunir seus funcionários, buscando promover interações e a criação de vínculos entre os colaboradores. Um dos eventos criados foi o Spotifest, um festival de música exclusivo para seus funcionários, e também o Intro Days, que leva os funcionários à sede da empresa em Estocolmo, na Suécia (Mohan, 2024).", "Dessa forma, as empresas que querem se manter longevas e produtivas precisam se preocupar cada vez mais com a qualidade de vida de seus funcionários, para que eles possam continuar produtivos, para que não tenham uma taxa de turnover alta e para que possam atrair novos talentos, já que a qualidade do ambiente de trabalho é um fator importante na hora de se candidatar a uma vaga."], "references": ["MOHAN, Pavithra. O que o Spotify aprendeu em três anos de esquema de trabalho remoto. Fast Company Brasil, 14 nov. 2024.", "MICHAEL PAGE. Modelos de trabalho pós-pandemia. São Paulo: Michael Page, [s.d.].", "PERFIL SAÚDE CORPORATIVA. Brasil registra recorde de afastamentos por saúde mental e acende alerta. G1, 05 out. 2026. Disponível em: https://g1.globo.com/sp/santos-regiao/especialpublicitario/perfil-gestao-ocupacional-perfil-saude-corporativa-pessoasmais-cuidadas-empresas-mais-saudaveis/noticia/2026/10/05/brasilregistra-recorde-de-afastamentos-por-saude-mental-e-acendealerta.ghtml. Acesso em: 06 out. 2026.", "SPOTIFY. Distributed-first is the future of work at Spotify. Spotify Newsroom, 12 fev. 2021. Disponível em: https://newsroom.spotify.com/2021-02-12/distributed-first-is-the-futureof-work-at-spotify/. Acesso em: 06 out. 2026.", "WELLHUB. ROI do Bem-Estar 2026: pressão por IA e saúde mental devem redefinir quais empresas conseguirão sustentar performance nos próximos anos. São Paulo: Wellhub, 2026."]}, {"id": "materia-7", "title": "Quando os números escondem a verdade", "author": "João Vitor Costa da Silva", "category": "Finanças", "pages": [18, 19], "body": ["Por trás de cada balanço patrimonial, existe uma promessa silenciosa: a de que aqueles números representam a verdade sobre a empresa que os produziu. A contabilidade nasceu para sustentar exatamente essa promessa, traduzindo o dia a dia de um negócio em informações que investidores, bancos, fornecedores e até o governo usam para tomar decisões que movimentam empregos, patrimônios e o futuro de milhares de famílias. Quando essa tradução é feita com honestidade, o mercado inteiro ganha em previsibilidade e confiança. O problema é que essa mesma linguagem pode ser usada para esconder, e não para revelar. Quando alguém manipula esses registros de propósito, o que seria um erro técnico se torna um ato capaz de atingir a vida de milhares de pessoas que nunca tiveram nenhum contato direto com a empresa. Foi isso que aconteceu no caso da Americanas, uma das maiores fraudes contábeis já registradas no Brasil, que até hoje segue como alerta para quem estuda e trabalha com contabilidade (Soares; Flávio; Rezende, 2024).", "Em janeiro de 2023, a empresa informou ao mercado que havia encontrado inconsistências contábeis de cerca de 20 bilhões de reais em seu balanço. Aos poucos, descobriu-se que parte do problema vinha de uma forma de financiamento usada para antecipar pagamentos a fornecedores por meio de bancos. Em vez de mostrar esse valor como dívida bancária, a empresa registrava a operação de um jeito que diminuía o saldo da conta de fornecedores, dando a impressão de um endividamento bem menor do que o real.", "Também houve acordos comerciais com fornecedores sem nenhum respaldo econômico verdadeiro, lançados apenas para inflar os lucros mostrados aos investidores. O resultado foi um pedido de recuperação judicial, com dívidas que passaram dos 40 bilhões de reais.", "Esse tipo de manipulação tem nome na área contábil, chama-se “contabilidade criativa”. Muitas vezes ela nem chega a ser considerada fraude, pois se aproveita de brechas e de interpretações flexíveis das próprias normas contábeis para", "a imagem que a administração da empresa quer passar para o mercado. O problema é que a linha entre criatividade e fraude é bem mais fina do que parece. Quando a manipulação para de ser apenas uma escolha dentro das normas e passa a esconder informação de propósito, ela vira aquilo que a própria profissão contábil define como fraude, um ato intencional de omitir ou manipular registros e demonstrações.", "Na minha visão, o caso Americanas mostra que o problema não está só na empresa que manipulou os números, mas em todo o sistema que deveria impedir que isso acontecesse. A auditoria externa existe justamente para confirmar se as demonstrações financeiras representam a realidade. Ainda assim, no caso da Americanas, essas inconsistências passaram despercebidas por anos, mesmo com auditorias sendo feitas durante todo esse período. Isso levanta uma pergunta incômoda. Até que ponto um auditor consegue ser realmente independente quando é a própria empresa auditada quem paga pelo seu serviço?", "Além do prejuízo direto para acionistas e credores, uma fraude contábil desse tamanho abala a confiança em todo o mercado. Investidores passam a desconfiar até de empresas sérias, o que encarece o crédito para todo mundo, já que ninguém quer emprestar dinheiro sem ter certeza de que os números apresentados são verdadeiros. O prejuízo, então, não fica restrito a quem cometeu o erro, ele se espalha por toda a economia (El Khatib, 2023).", "Por isso, acredito que resolver esse problema exige mais do que criar regras contábeis no papel. É preciso fortalecer a independência dos auditores, cobrar mais rigor dos conselhos de administração e, principalmente, formar profissionais de contabilidade com uma base ética sólida, capazes de perceber quando uma prática deixou de ser técnica e passou a ser antiética. Como estudante de Ciências Contábeis, entendo que serei parte desse sistema no futuro, e que vai caber também a mim decidir se os números que eu produzir vão contar a verdade ou vão esconder aquilo que alguém prefere não mostrar.", "O caso Americanas não deve ser lembrado apenas como um escândalo financeiro, mas como um exemplo do que acontece quando a contabilidade deixa de cumprir sua função mais básica, que é representar a realidade com fidelidade. Reconstruir a confiança nas informações contábeis depende de auditorias mais independentes, de fiscalização mais efetiva e de profissionais dispostos a colocar a ética acima dos resultados de curto prazo."], "references": ["CNN BRASIL. 2 anos de fraude na Americanas: relembre caso que marcou história corporativa do país. CNN Brasil, 2025. Disponível em: https://www.cnnbrasil.com.br/economia/money/negocios/2-anos-defraude-na-americanas-relembre-caso-que-marcou-historia-corporativa-do-pais/. Acesso em: 10 out. 2026. EL KHATIB, Ahmed Sameer. Criatividade contábil ou contabilidade criativa? Algumas reflexões. FECAP, 03 dez. 2023. SOARES, Rafael e Silva; FLÁVIO, Milena Carolina Nascimento; REZENDE, Paula Andréa de Oliveira e Silva. Estudo de caso sobre as inconsistências contábeis da Americanas S.A.: proposta de modelo para detecção de fraudes. Revista Contemporânea, v. 4, n. 6, e4892, 2024. DOI: 10.56083/RCV4N6-207."]}, {"id": "materia-8", "title": "A segurança da informação e os desafios cibernéticos na contabilidade moderna", "author": "Kathlen de Cassia Galdino da Silva", "category": "Contabilidade e tecnologia", "pages": [20, 21], "body": ["A contabilidade sofreu grandes transformações ao longo de sua história, e a que gerou mais impacto foi a tecnologia da informação. Antes da digitalização, todo o trabalho contábil era feito manualmente e guardado em arquivos físicos, porém atualmente todas as informações contábeis sigilosas de uma empresa são armazenadas dentro de sistemas de software. Frente a esse avanço da tecnologia, os escritórios de contabilidade enfrentam uma vulnerabilidade de seus sistemas de controle, na qual estão frequentemente expostos a ataques cibernéticos, focados em roubos de dados e vazamento de informação. Diante disso, é necessário entender como esses ciberataques afetam a contabilidade de suas empresas assessoradas.", "Um escritório de contabilidade lida diariamente com dados fiscais, contratos sociais, tributações e outras informações extremamente sigilosas para uma empresa, todo esse conteúdo é gerido dentro dos sistemas, os quais, por sua vez, ainda não se mostram 100% protegidos. Em notícia publicada no portal G1 por Marcelo Marques (2018), foi divulgado o caso de um escritório de contabilidade que teve seu sistema criptografado por hackers, que exigiram mil dólares em bitcoins para liberar o acesso. Em entrevista, uma funcionária destacou: “[...] Prestamos serviços para prefeituras e câmaras municipais. Então, essas instituições têm Portal da Transparência e prestam contas mensais [de gastos públicos]. Todo nosso trabalho deste ano terá de ser refeito em um mês por conta dessa invasão no nosso sistema”. Com esse caso real, fica evidente a fragilidade dos sistemas e de como a reputação do escritório fica comprometida, perdendo sua credibilidade no mercado.", "Em outra perspectiva, os ataques a sistemas contábeis também geram impactos negativos para as empresas contratantes. Isso pode acarretar problemas, como, emissão de guias de impostos com valores alterados, atrasos financeiros, uso indevido de contratos e assinaturas, além da manipulação de folhas de pagamento. Para garantir a segurança institucional das empresas em âmbitos digitais, foi regulamentada, em 2018,", "a Lei Geral de Proteção de Dados Pessoais (LGPD), que estabelece regras claras sobre como as empresas devem coletar, utilizar e proteger informações. Dessa forma, assegura-se o direito do cliente de ter seus dados mantidos em segurança e inalterados enquanto estiverem sob a responsabilidade do escritório de contabilidade.", "Em decorrência disso, como os dados pessoais são protegidos por lei, os escritórios também podem enfrentar penalidades jurídicas, caso ocorra violação das informações de seus clientes. O titular lesado pode buscar indenização por prejuízos, visto que a empresa prestadora de serviço tem responsabilidade legal a ser cumprida sobre a segurança de dados. Conforme estabelece o art. 42 da Lei nº 13.709, Lei Geral De Proteção De Dados (LGPD): “O controlador ou o operador que, em razão do exercício de atividade de tratamento de dados pessoais, causar a outrem dano patrimonial, moral, individual ou coletivo, em violação à legislação de proteção de dados pessoais, é obrigado a repará-lo” (Brasil, 2018).", "Portanto, é possível concluir que os escritórios de contabilidade têm grandes responsabilidades, no que diz respeito à segurança da informação de seus clientes e como deve se proteger de ciberataques. Dessa forma, para uma melhor gestão de informações, é importante adotar procedimentos para mitigar os riscos, como, estabelecer parcerias com especialistas em TI e implantar protocolos obrigatórios de segurança e treinamento da equipe, a fim de garantir a integridade do ecossistema contábil, blindar as empresas contra ameaças e cumprir as diretrizes da Lei nº 13.709/2018 (LGPD)."], "references": ["BRASIL. Lei nº 13.709, de 14 de agosto de 2018. Lei Geral de Proteção de Dados Pessoais (LGPD). Brasília, DF: Presidência da República, 2018. Disponível em: http://www.planalto.gov.br/ccivil_03/_ato20152018/2018/lei/l13709.htm. Acesso em: 24 ago. 2026. MARQUES, Marcelo. Hackers invadem sistema de empresa contábil em Boa Vista e exigem mil dólares em bitcoin para descriptografar dados. G1 RR, Boa Vista, 01 out. 2018. Disponível em: https://g1.globo.com/rr/roraima/noticia/2018/10/01/hackersinvadem-sistema-de-emp resa-contabil-em-boa-vista-eexigem-mil-dolares-em-bitcoin-para-descriptografar-da dos.ghtml. Acesso em: 13 ago. 2026. SANTOS, Gabriel Fernando Pereira dos; AMORIM, Matheus Pestana. Segurança da Informação em escritórios contábeis: um estudo de caso. Trabalho de Conclusão de Curso (Tecnologia em Segurança da Informação) – Faculdade de Tecnologia de Americana, Centro Estadual de Educação Tecnológica Paula Souza, Americana, SP, 2019. Disponível em: https://ric.cps.sp.gov.br/bitstream/123456789/3730/1/2019 1S_SANTOSGabrielFerna ndoPereirados_OD0661.pdf. Acesso em: 13 ago. 2026."]}, {"id": "materia-9", "title": "A utilização do compliance para prevenção do branqueamento de capitais e o financiamento do terrorismo no Brasil", "author": "Lara Bráz de Paula", "category": "Compliance", "pages": [22, 23], "body": ["A técnica do compliance pode ser descrita, dentro do cenário corporativo e institucional, como um conjunto de procedimentos que possuem como finalidade cumprir as normas legais e regulamentares, bem como as políticas e diretrizes institucionais, além de detectar, evitar e tratar qualquer desvio ou inconformidade que possa ocorrer dentro da organização.", "Nesse viés, observa-se que boa parte dos recursos que financiam grupos terroristas e que são desviados para lavagem de dinheiro são obtidos por meio de donativos recebidos de pessoas e entidades, as quais desconhecem sua destinação. Desse modo, nota-se que tal problemática é oriunda da escassez de monitoramento efetivo do dinheiro e da falta de conhecimento dos destinatários. Tais situações destacam a relevância do compliance, citado anteriormente, para a prevenção da continuidade desse financiamento involuntário, uma vez que sua aplicação efetiva busca trazer informações mais aprofundadas a respeito de cada transação financeira de uma empresa antes mesmo de serem feitas, proporcionando assim o entendimento e a verificação do real destino de seus recursos.", "Ao analisar o terrorismo no cenário global, relatórios recentes, publicados no relatório de riscos de financiamento do terrorismo (FATF, 2025), enfatizam que as ameaças desse crime estão em constante evolução, impulsionadas pela tecnologia nas práticas utilizadas por esses grupos. Diante disso, destacam-se como novas técnicas o uso de tecnologias financeiras emergentes, como criptoativos, sistemas de pagamento peer-to-peer e plataformas de crowdfunding, bem como a diversificação das fontes de receita, por meio de redes de caridade, doações e pequenos negócios, o que exemplifica o desconhecimento da destinação de recursos já discutida.", "Dessa forma, visto que esse financiamento do terrorismo e o branqueamento de capitais se tornou um alarmante problema a nível mundial, a utilização do compliance passa a ser fundamental não apenas para as empresas em geral, mas é exigida pelo próprio Banco Central às instituições do sistema financeiro. Nesse sentido, a atuação reguladora do Banco Central contribui para assegurar um sistema financeiro nacional sólido e eficiente, porquanto colabora para mitigar os riscos e suas consequências financeiras ao fiscalizar e supervisionar, por meio da exigência de princípios e práticas regulares de compliance, a participação dos bancos e demais instituições no combate à lavagem de dinheiro e ao financiamento do terrorismo (Banco Central do Brasil, [s.d.]).", "Após citar a relevância de uma instituição reguladora no país para a prevenção da problemática, é válido lembrar também do dever legal estabelecido no Brasil para combater essas práticas. o setor empresarial, a Lei nº 12.846/2013 (Lei Anticorrupção) incentiva a criação de programas de integridade, enquanto a Lei nº 9.613/1998 impõe às pessoas físicas e jurídicas", "que atuam no setor econômico-financeiro a responsabilidade de identificar clientes, manter cadastros atualizados, registrar operações, comunicar operações suspeitas ao COAF (Conselho de Controle de Atividades Financeiras) e adotar políticas, procedimentos e controles internos, ou seja, aplicarem na prática o compliance.", "Por conseguinte, reitero a importância do compliance na prevenção do financiamento do terrorismo e do branqueamento de capitais, uma vez que, mediante a existência de mecanismos e procedimentos internos de integridade, o incentivo a denúncias de irregularidades e a aplicação ativa de códigos de ética e conduta, pode-se monitorar de maneira mais crítica e contínua todos os gastos e movimentações atípicas, bem como o destino desse dinheiro, verificando se está sendo direcionado para uma empresa ou associação segura e não para o desvio irregular voltado ao branqueamento de capitais ou ao financiamento do terrorismo."], "references": ["BANCO CENTRAL DO BRASIL. Prevenção à lavagem de dinheiro e ao financiamento do terrorismo. Brasília, DF: Banco Central do Brasil. BRASIL. Lei nº 9.613, de 3 de março de 1998. Dispõe sobre os crimes de lavagem ou ocultação de bens, direitos e valores; a prevenção da utilização do sistema financeiro para os ilícitos previstos nesta Lei; cria o Conselho de Controle de Atividades Financeiras – Coaf e dá outras providências. Brasília, DF: Presidência da República, 1998. BRASIL. Lei nº 12.846, de 1º de agosto de 2013. Dispõe sobre a responsabilização administrativa e civil de pessoas jurídicas pela prática de atos contra a administração pública. Brasília, DF: Presidência da República, 2013. CONSELHO DE CONTROLE DE ATIVIDADES FINANCEIRAS (COAF). Deveres de PLD/FTP. Brasília, DF: COAF, 2026. FINANCIAL ACTION TASK FORCE (FATF). Comprehensive update on terrorist financing risks 2025. Paris: FATF/OECD, 2025."]}], "credits": [["Reitora", "Profª Dra. Solange Munhoz Arroyo Lopes"], ["Pró-Reitora Presencial", "Profª Dra. Sara Macente Boni"], ["Pró-Reitor de Pesquisa, Pós-Graduação e Inovação", "Prof. Dr. Ivan Dias da Motta"], ["Coordenação", "Profª Me. Larissa Ruiz Golemba de Britto"], ["Editoria", "Prof. Me. Gabriel Coutinho Calvi"], ["Comissão Científica", "Prof. Me. Gabriel Coutinho Calvi; Profª Me. Larissa Ruiz Golemba de Britto; Prof. Dr. Lucas Felipe Batista Bispo; Profª Dra. Danieli Pinto; Profª Dra. Luana da Silva Ribeiro; Prof. Me. Leandro Matheus Fogate; Profª Me. Thiara Laty Soares Stivari Socolovithc"], ["Revisão Técnica e Textual", "Prof. Dr. Lucas Felipe Batista Bispo"], ["Design e Criação", "Prof. Me. Gabriel Coutinho Calvi"], ["Comissão de Divulgação", "Conage – Consultoria Empresarial Junior"]], "intro": "A revista IDEA nasce como projeto de extensão dos cursos presenciais de Administração, Processos Gerenciais e Ciências Contábeis da Unicesumar, transformando pesquisas e experiências práticas, desenvolvidas em sala de aula, em conhecimento compartilhado. O propósito da IDEA é aproximar ensino, pesquisa e extensão, valorizando o protagonismo dos estudantes e dando visibilidade às produções desenvolvidas ao longo da formação acadêmica. Durante o semestre, os estudantes são convidados a pesquisar, analisar, criar, desenvolver projetos práticos e transformar conhecimentos acadêmicos em produções disponíveis para toda a comunidade. Um espaço de produção e circulação do conhecimento, destinado à publicação de textos acadêmicos, pesquisas, análises de mercado, estudos de caso e outras produções relacionadas às áreas de formação dos cursos envolvidos. A Revista, de periodicidade bimestral, busca estimular a iniciação à pesquisa, a produção textual e a comunicação do conhecimento para além dos limites da sala de aula."}</script><script src="js/app.js" defer></script></body></html>
